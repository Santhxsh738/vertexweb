<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Consultation | VERTEXWEB</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #050811;
            --bg-secondary: #0b0f19;
            --card-bg: #111827;
            --accent-blue: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); line-height: 1.7; }
        
        .booking-container { max-width: 600px; margin: 60px auto; background: var(--card-bg); border: 1px solid var(--border-color); padding: 40px; border-radius: 12px; }
        .booking-container h2 { font-size: 28px; margin-bottom: 10px; text-align: center; }
        .booking-container p { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); font-size: 13px; }

        .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .slot-btn { background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 6px; font-size: 12px; cursor: pointer; text-align: center; transition: 0.3s; }
        .slot-btn:hover, .slot-btn.selected { background: var(--accent-blue); border-color: var(--accent-blue); color: white; }

        .btn { background: var(--accent-blue); color: white; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="booking-container">
        <h2>📅 Book a Free Consultation</h2>
        <p>Select your preferred date and time slot to discuss your web development project with us.</p>
        
        <form id="bookingForm">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email5" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Select Date</label>
                <input type="date" required>
            </div>
            <div class="form-group">
                <label>Select Time Slot</label>
                <div class="slots-grid">
                    <div class="slot-btn">10:00 AM</div>
                    <div class="slot-btn">02:00 PM</div>
                    <div class="slot-btn">05:00 PM</div>
                </div>
            </div>
            <button type="submit" class="btn">Confirm Booking</button>
        </form>
    </div>
    <script src="script.js"></script>

    <script>
        document.querySelectorAll('.slot-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            });
        });

        document.getElementById('bookingForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Consultation booked successfully! We will email you the confirmation details.');
            e.target.reset();
        });
    </script>
</body>
</html>
